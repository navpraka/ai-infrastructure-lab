apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-hpa-demo
  namespace: autoscaling-lab
  labels:
    app.kubernetes.io/name: cpu-hpa-demo
    app.kubernetes.io/part-of: ai-infrastructure-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-hpa-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-hpa-demo
        app.kubernetes.io/part-of: ai-infrastructure-lab
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: workload
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -u
            - -c

          args:
            - |
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              import hashlib

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/health":
                          value = b"ai-infrastructure-lab"
                          for _ in range(250000):
                              value = hashlib.sha256(value).digest()

                      body = b"CPU HPA demo response\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, format, *args):
                      return

              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi

---
apiVersion: v1
kind: Service
metadata:
  name: cpu-hpa-demo
  namespace: autoscaling-lab
  labels:
    app.kubernetes.io/name: cpu-hpa-demo
    app.kubernetes.io/part-of: ai-infrastructure-lab
spec:
  selector:
    app.kubernetes.io/name: cpu-hpa-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
