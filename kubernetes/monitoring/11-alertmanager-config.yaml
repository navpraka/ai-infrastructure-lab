apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alert-routing
    app.kubernetes.io/part-of: ai-infrastructure-lab
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: lab-console
      group_by:
        - cluster
        - alertname
        - severity
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h

    receivers:
      - name: lab-console
