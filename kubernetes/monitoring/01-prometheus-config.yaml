apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: ai-infrastructure-lab
    rule_files:
      - /etc/prometheus/rules/*.yaml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: kubernetes-health-reporter
        metrics_path: /kubernetes-health-report.prom
        fallback_scrape_protocol: PrometheusText0.0.4
        static_configs:
          - targets:
              - health-reporter-metrics.ai-infrastructure.svc.cluster.local:8080
