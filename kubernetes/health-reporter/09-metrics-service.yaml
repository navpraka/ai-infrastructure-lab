apiVersion: v1
kind: Service
metadata:
  name: health-reporter-metrics
  namespace: ai-infrastructure
  labels:
    app.kubernetes.io/name: kubernetes-health-reporter
    app.kubernetes.io/component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /kubernetes-health-report.prom
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-health-reporter
    app.kubernetes.io/component: metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
