apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubernetes-health-reporter
  namespace: ai-infrastructure
  labels:
    app.kubernetes.io/name: kubernetes-health-reporter
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubernetes-health-reporter
        spec:
          serviceAccountName: health-reporter
          automountServiceAccountToken: true
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: health-reporter
              image: ghcr.io/navpraka/ai-infrastructure-lab/kubernetes-health-reporter@sha256:60936b8a487d263f99e5417ecbf1545fcb05f5c2b41a2c47c9fc0ae358ab18ec
              imagePullPolicy: IfNotPresent
              workingDir: /app

              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi

              volumeMounts:
                - name: reports
                  mountPath: /app/output
                - name: temporary-files
                  mountPath: /tmp

          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: health-reporter-output
            - name: temporary-files
              emptyDir:
                sizeLimit: 64Mi
