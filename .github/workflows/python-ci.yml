name: Python and Docker CI

on:
  push:
    branches:
      - main
    paths:
      - "python/**/*.py"
      - "tests/**/*.py"
      - "requirements-dev.txt"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/python-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "python/**/*.py"
      - "tests/**/*.py"
      - "requirements-dev.txt"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: python-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and container build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            python/automation/kubernetes_health_report.py

      - name: Run unit tests
        run: python -m pytest -v

      - name: Build container image
        run: |
          docker build \
            --file docker/kubernetes-health-reporter/Dockerfile \
            --tag health-reporter-ci:test \
            .

      - name: Verify Python in container
        run: |
          docker run --rm \
            --entrypoint python \
            health-reporter-ci:test \
            --version

      - name: Verify kubectl in container
        run: |
          docker run --rm \
            --entrypoint kubectl \
            health-reporter-ci:test \
            version --client

      - name: Verify non-root container user
        run: |
          test "$(
            docker run --rm \
              --entrypoint id \
              health-reporter-ci:test \
              -u
          )" = "10001"
